name: "Terraform Plan & Destroy"

on:
  workflow_dispatch: 

permissions:
  id-token: write
  contents: read

jobs:
  terraform-destroy:
    name: "Destroy Plan & Execute"
    runs-on: ubuntu-latest
    environment: develop
    
    steps:
      - name: "Checkout Code"
        uses: actions/checkout@v4

      - name: "Azure Login"
        uses: azure/login@v2
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}

      - name: "Setup Terraform"
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.10.0"

      - name: "Terraform Init"
        run: |
          terraform init \
            -backend-config="resource_group_name=${{ vars.TF_STATE_RG }}" \
            -backend-config="storage_account_name=${{ vars.TF_STATE_STORAGE_ACCOUNT }}" \
            -backend-config="container_name=${{ vars.TF_STATE_CONTAINER }}" \
            -backend-config="key=${{ vars.TF_STATE_KEY }}"

      - name: "Terraform Plan Destroy"
        id: destroy-plan
        run: terraform plan -destroy -var-file="develop.tfvars" -out=destroy.tfplan

      - name: "Show Destroy Plan Details"
        run: terraform show destroy.tfplan

      - name: "Terraform Destroy"
        run: terraform apply -auto-approve destroy.tfplan