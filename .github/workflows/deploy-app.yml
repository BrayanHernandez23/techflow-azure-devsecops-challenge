name: "Deploy Application"

on:
  workflow_dispatch:
    inputs:
      environment:
        description: 'Environment to be deployed'
        required: true
        default: 'develop'
  pull_request:
    branches:
      - develop
      - main
    paths:
      - 'app/**'
      - '.github/workflows/deploy-app.yml'

permissions:
  id-token: write
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-scan:
    name: "Build, Scan & Push"
    runs-on: ubuntu-latest
    environment: ${{ github.event_name == 'pull_request' && 'develop' || github.event.inputs.environment }}
    
    steps:
      - name: "Checkout Code"
        uses: actions/checkout@v6

      - name: "Build Local Image"
        run: |
          docker build -t techflow-api:${{ github.sha }} ./app

      - name: "Run Trivy Vulnerability Scanner"
        uses: aquasecurity/trivy-action@v0.33.1
        with:
          image-ref: 'techflow-api:${{ github.sha }}'
          format: 'table'
          exit-code: '1' 
          ignore-unfixed: true
          vuln-type: 'os,library'
          severity: 'CRITICAL,HIGH'

      - name: "Azure Login"
        uses: azure/login@v2
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}

      - name: "Login to ACR"
        run: |
          az acr login --name ${{ secrets.ACR_NAME }}

      - name: "Push Image to ACR"
        run: |
          docker tag techflow-api:${{ github.sha }} ${{ secrets.ACR_LOGIN_SERVER }}/techflow-api:latest
          docker tag techflow-api:${{ github.sha }} ${{ secrets.ACR_LOGIN_SERVER }}/techflow-api:${{ github.sha }}
          docker push ${{ secrets.ACR_LOGIN_SERVER }}/techflow-api:latest
          docker push ${{ secrets.ACR_LOGIN_SERVER }}/techflow-api:${{ github.sha }}

  deploy-to-azure:
    name: "Update Container App"
    needs: build-and-scan
    runs-on: ubuntu-latest
    steps:
      - name: "Azure Login"
        uses: azure/login@v2
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}

      - name: "Update Container App Revision"
        run: |
          az containerapp update \
            --name "${{ secrets.CONTAINER_APP_NAME }}" \
            --resource-group "${{ secrets.RESOURCE_GROUP }}" \
            --image ${{ secrets.ACR_LOGIN_SERVER }}/techflow-api:latest

      - name: "Display Application URL"
        run: |
          APP_URL=$(az containerapp show \
            --name "${{ secrets.CONTAINER_APP_NAME }}" \
            --resource-group "${{ secrets.RESOURCE_GROUP }}" \
            --query "properties.configuration.ingress.fqdn" -o tsv)
          
          echo "## 🚀 Ingresa a este link para visualizar tu aplicacion" >> $GITHUB_STEP_SUMMARY
          echo "Tu aplicación está lista en: [https://$APP_URL](https://$APP_URL)" >> $GITHUB_STEP_SUMMARY
          echo "✅ Deploy completado con éxito." >> $GITHUB_STEP_SUMMARY