name: "Deploy Application"

on:
  workflow_dispatch:
    inputs:
      environment:
        description: 'Entorno a desplegar'
        required: true
        default: 'develop'
  push:
    branches:
      - feature/infra-setup

permissions:
  id-token: write
  contents: read

jobs:
  build-and-scan:
    name: "Build, Scan & Push"
    runs-on: ubuntu-latest
    environment: develop
    
    steps:
      - name: "Checkout Code"
        uses: actions/checkout@v4

      - name: "Build Local Image"
        run: |
          docker build -t techflow-api:${{ github.sha }} ./app

      - name: "Run Trivy Vulnerability Scanner"
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: 'techflow-api:${{ github.sha }}'
          format: 'table'
          exit-code: '1' 
          ignore-unfixed: true
          vuln-type: 'os,library'
          severity: 'CRITICAL,HIGH'

      - name: "Azure Login"
        uses: azure/login@v2
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}

      - name: "Login to ACR"
        run: |
          az acr login --name ${{ secrets.ACR_NAME }}

      - name: "Push Image to ACR"
        run: |
          docker tag techflow-api:${{ github.sha }} ${{ secrets.ACR_LOGIN_SERVER }}/techflow-api:latest
          docker tag techflow-api:${{ github.sha }} ${{ secrets.ACR_LOGIN_SERVER }}/techflow-api:${{ github.sha }}
          docker push ${{ secrets.ACR_LOGIN_SERVER }}/techflow-api:latest
          docker push ${{ secrets.ACR_LOGIN_SERVER }}/techflow-api:${{ github.sha }}

  deploy-to-azure:
    name: "Update Container App"
    needs: build-and-scan
    runs-on: ubuntu-latest
    steps:
      - name: "Azure Login"
        uses: azure/login@v2
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}

      - name: "Update Container App Revision"
        run: |
          az containerapp update \
            --name "${{ secrets.CONTAINER_APP_NAME }}" \
            --resource-group "${{ secrets.RESOURCE_GROUP }}" \
            --image ${{ secrets.ACR_LOGIN_SERVER }}/techflow-api:latest