name: "Deploy Application"

on:
  workflow_dispatch: 
    inputs:
      environment:
        description: 'Entorno a desplegar'
        required: true
        default: 'develop'

permissions:
  id-token: write
  contents: read

jobs:
  deploy:
    name: "Build & Deploy App"
    runs-on: ubuntu-latest
    environment: develop

    steps:
      - name: "Checkout Code"
        uses: actions/checkout@v4

      - name: "Azure Login"
        uses: azure/login@v2
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}

      - name: "Login to ACR"
        run: |
          az acr login --name ${{ vars.ACR_NAME }}

      - name: "Build Docker Image"
        run: |
          docker build -t ${{ vars.ACR_LOGIN_SERVER }}/techflow-api:latest ./app

      - name: "Push Image to ACR"
        run: |
          docker push ${{ vars.ACR_LOGIN_SERVER }}/techflow-api:latest

      - name: "Update Container App Service"
        run: |
          az containerapp update \
            --name "ca-${{ vars.PROJECT_NAME }}-api" \
            --resource-group "rg-${{ vars.PROJECT_NAME }}-${{ github.event.inputs.environment }}" \
            --image ${{ vars.ACR_LOGIN_SERVER }}/techflow-api:latest