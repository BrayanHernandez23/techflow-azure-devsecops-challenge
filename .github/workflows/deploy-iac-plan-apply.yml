name: "Terraform Plan & Apply"

on:
  push:
    branches:
      - feature/infra-setup
      - develop
      - main

permissions:
  id-token: write
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  terraform:
    name: "Azure Deployment"
    runs-on: ubuntu-latest
    environment: develop
    
    env:
      ARM_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
      ARM_CLIENT_SECRET: ${{ secrets.AZURE_CLIENT_SECRET }}
      ARM_SUBSCRIPTION_ID: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
      ARM_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
      ARM_ACCESS_KEY: ${{ secrets.TF_STATE_ACCESS_KEY }}

    steps:
      - name: "Checkout Code"
        uses: actions/checkout@v4

      - name: "Run Checkov IaC Scan"
        id: checkov
        uses: bridgecrewio/checkov-action@master
        with:
          directory: .
          framework: terraform
          soft_fail: true 
          output_format: cli
          quiet: true

      - name: "Setup Terraform"
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.10.0"

      - name: "Terraform Init"
        run: |
          terraform init \
            -backend-config="resource_group_name=${{ secrets.TF_STATE_RG }}" \
            -backend-config="storage_account_name=${{ secrets.TF_STATE_STORAGE_ACCOUNT }}" \
            -backend-config="container_name=${{ secrets.TF_STATE_CONTAINER }}" \
            -backend-config="key=${{ secrets.TF_STATE_KEY }}"

      - name: "Terraform Format Check"
        run: terraform fmt -check

      - name: "Terraform Plan"
        id: plan
        run: terraform plan -lock=false -var-file="develop.tfvars" -out=tfplan -input=false

      - name: "Terraform Apply"
        if: github.ref == 'refs/heads/develop' || github.ref == 'refs/heads/feature/infra-setup'
        run: terraform apply -lock=false -auto-approve tfplan